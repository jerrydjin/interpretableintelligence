[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interpretableintelligence"
version = "0.2.0"
description = "Mechanistic interpretability for physical AI models: shared run format, scoring core, and causal rollouts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=18.1.0",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "python-multipart>=0.0.9",
    "safetensors>=0.4",
    "torch>=2.2",
    "transformers>=5.22,<6",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Marker for LIBERO / OpenVLA / pi0.5 adapters. Empty on purpose: the default
# install and this extra both stay free of simulators and GPU packages.
# The adapters are stubs until that lane lands.
robots = []

[project.scripts]
interpretableintelligence = "interpretableintelligence.cli:app"
ii = "interpretableintelligence.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "playwright>=1.49",
    "pytest>=8",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "-m", "not slow"]
markers = [
    "slow: large synthetic runs, or a V-JEPA 2 weight download; skipped unless pytest is run with -m slow",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
