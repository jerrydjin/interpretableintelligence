[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physint"
version = "0.1.0"
description = "Mechanistic interpretability for physical AI models: shared run format and scoring core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "python-multipart>=0.0.9",
    "safetensors>=0.4",
    "torch>=2.2",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
physint = "physint.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "playwright>=1.49",
    "pytest>=8",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: large synthetic runs"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
