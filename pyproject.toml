[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physint"
version = "0.1.0"
description = "Mechanistic interpretability for physical AI models: shared run format and scoring core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "safetensors>=0.4",
    "torch>=2.2",
    "typer>=0.12",
]

[project.scripts]
physint = "physint.cli:app"

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.49"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
