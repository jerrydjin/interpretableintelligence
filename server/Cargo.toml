[package]
name = "interpretableintelligence-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read API for an interpretableintelligence run folder. Queries parquet with DuckDB."

[[bin]]
name = "interpretableintelligence-server"
path = "src/main.rs"

[lib]
name = "interpretableintelligence_server"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
bytes = "1"
crc32fast = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
duckdb = { version = "1.20000.1", features = ["download-lib"] }
http-body-util = "0.1"
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["trace"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
