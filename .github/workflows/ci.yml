name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        # The viewer transcodes avi, mov and mkv clips with ffmpeg; tests/test_view.py exercises that path.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Test
        env:
          II_DEVICE: cpu
        run: uv run pytest
